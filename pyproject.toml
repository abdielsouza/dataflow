[project]
name = "dataflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "polars[rtcompat]>=1.44.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "httpx>=0.28.1",
    "dataflow-analytics",
    "dataflow-domain",
    "dataflow-execution",
    "dataflow-storage",
    "dataflow-infrastructure",
]

api = [
    "dataflow-api",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/domain",
    "packages/analytics",
    "packages/execution",
    "packages/storage",
    "packages/infrastructure",
]

[tool.uv.sources]
dataflow-analytics = { workspace = true }
dataflow-domain = { workspace = true }
dataflow-execution = { workspace = true }
dataflow-storage = { workspace = true }
dataflow-infrastructure = { workspace = true }
dataflow-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"packages/execution/dataflow_execution/engine.py" = ["BLE001"]

[tool.mypy]
python_version = "3.15"
strict = true
