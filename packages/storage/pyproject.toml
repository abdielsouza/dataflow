[project]
name = "dataflow-storage"
version = "0.1.0"
description = "Storage tools for Dataflow."
requires-python = ">=3.15"
dependencies = [
    "dataflow-domain",
    "polars[rtcompat]>=1.33",
]

[tool.uv.sources]
dataflow-domain = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""