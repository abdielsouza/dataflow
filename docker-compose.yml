name: dataflow
services:
  api:
    container_name: dataflow-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      - uv
      - run
      - --project
      - /app/apps/api
      - uvicorn
      - dataflow_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    volumes:
      - .:/app
    networks:
      - dataflow-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 8000), 3); s.close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  
  web:
    container_name: dataflow-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command:
      - bun
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./apps/web:/app/apps/web
      - web_node_modules:/app/apps/web/node_modules
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dataflow-network

networks:
  dataflow-network:
    driver: bridge

volumes:
  web_node_modules: